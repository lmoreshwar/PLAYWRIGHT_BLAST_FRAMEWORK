# BLAST Agent-Loop Generate — the standalone agentic "Generate" path.
#
# Reproduces the local Copilot agent loop in the cloud: explore the live app
# (snapshot → read real refs → act → verify) → generate Page/Module/Spec with
# capability reuse → run the new spec → open a PR on green. Zero laptop terminals.
#
# SECURITY — why credentials are NOT inputs:
#   workflow_dispatch inputs render in plain text in the Actions UI/logs. The app
#   login username/password therefore travel as ENCRYPTED REPOSITORY SECRETS
#   (AGENT_USERNAME / AGENT_PASSWORD), which the B.L.A.S.T. backend sets on this
#   repo (libsodium-encrypted, via api/_tools/github_secrets.js) immediately BEFORE
#   triggering this run. Only non-sensitive fields ride as inputs below.
name: BLAST Agent-Loop Generate

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Feature URL to automate'
        required: true
        type: string
      feature_name:
        description: 'Human feature name (used for branch/PR naming)'
        required: true
        type: string
      test_types:
        description: 'Comma list e.g. "positive,negative,boundary"'
        required: false
        default: 'positive'
        type: string
      max_cases:
        description: 'Max cases to author'
        required: false
        default: '3'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One feature run at a time per repo — matches the "overwrite the creds secret each run" model.
  group: blast-agentloop-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework repo
        uses: actions/checkout@v4

      - name: Checkout B.L.A.S.T. engine (holds agent-loop/)
        uses: actions/checkout@v4
        with:
          repository: lmoreshwar/my-ai-projects
          path: .blast-engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .blast-engine/AI_Agents/agent-loop/package-lock.json

      - name: Install framework dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # The agent loop drives Microsoft's @playwright/cli live (the agent "hands");
      # xvfb gives the headless runner a display so the real browser can start.
      - name: Install @playwright/cli + xvfb
        shell: bash
        run: |
          npm install -g @playwright/cli@latest
          sudo apt-get update && sudo apt-get install -y xvfb
          echo "playwright-cli: $(which playwright-cli || echo 'NOT FOUND')"

      - name: Install agent-loop dependencies
        working-directory: .blast-engine/AI_Agents/agent-loop
        run: npm ci

      - name: Generate (explore → codegen → verify → PR)
        working-directory: .blast-engine/AI_Agents/agent-loop
        env:
          # Non-sensitive job inputs.
          APP_URL: ${{ inputs.app_url }}
          FEATURE_NAME: ${{ inputs.feature_name }}
          TEST_TYPES: ${{ inputs.test_types }}
          MAX_CASES: ${{ inputs.max_cases }}
          # App login credentials — SECRETS ONLY (set by the backend just before dispatch).
          AGENT_USERNAME: ${{ secrets.APP_USERNAME }}
          AGENT_PASSWORD: ${{ secrets.APP_PASSWORD }}
          # The framework repo checkout the generated files + PR target.
          FRAMEWORK_PATH: ${{ github.workspace }}
          BASE_BRANCH: main
          PLAYWRIGHT_PROJECT: desktop-chrome
          # LLM (OpenAI-compatible). Set OPENAI_MODEL / OPENAI_BASE_URL to match your stack.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # PR/push token: the CONNECTED USER's own OAuth/App token (set as USER_GH_TOKEN by the
          # backend for account attribution). Falls back to a PAT, then the default repo token.
          GITHUB_TOKEN: ${{ secrets.USER_GH_TOKEN || secrets.BLAST_PAT || secrets.GITHUB_TOKEN }}
        # xvfb-run provides the display for the child playwright-cli browser spawns.
        run: xvfb-run -a npm run generate
