# B.L.A.S.T. cloud runner — generates + runs a test job in GitHub Actions,
# then opens a Pull Request (the human gate). Triggered by the B.L.A.S.T. API
# via the REST workflow_dispatch endpoint. Zero laptop terminals required.
name: BLAST Runner

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'B.L.A.S.T. job id (used for branch/PR naming)'
        required: true
        type: string
      job_payload:
        description: 'Full job JSON (jobId, url, environment, skill, testCases, comments, executionMode)'
        required: true
        type: string
      browser:
        description: 'Browser to install/run (Chrome, Edge, Firefox, Safari, All)'
        required: false
        default: 'Chrome'
        type: string
      level3:
        description: 'Level 3 — LLM drives @playwright/cli live during generate (verify-before-write)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blast-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework repo
        uses: actions/checkout@v4

      - name: Checkout B.L.A.S.T. engine (public app repo)
        uses: actions/checkout@v4
        with:
          repository: lmoreshwar/my-ai-projects
          path: .blast-engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install framework dependencies
        run: npm ci

      - name: Install Playwright browsers
        shell: bash
        run: |
          case "${{ inputs.browser }}" in
            Firefox) TARGETS="firefox" ;;
            Safari)  TARGETS="webkit" ;;
            Edge)    TARGETS="msedge" ;;
            All)     TARGETS="chromium firefox webkit" ;;
            *)       TARGETS="chromium" ;;
          esac
          echo "Installing Playwright browser(s): $TARGETS"
          npx playwright install --with-deps $TARGETS

      # Level 3 only: the Microsoft @playwright/cli binary (the agent "hands") + xvfb so the
      # headless runner can start a real browser for the live verify-before-write drive.
      - name: Install @playwright/cli + xvfb (Level 3)
        if: ${{ inputs.level3 }}
        shell: bash
        run: |
          npm install -g @playwright/cli@latest
          sudo apt-get update && sudo apt-get install -y xvfb
          echo "playwright-cli: $(which playwright-cli || echo 'NOT FOUND')"

      - name: Install engine dependencies
        working-directory: .blast-engine/AI_Agents
        run: npm ci

      # READ-BEFORE contract: the reuse index IS committed, but rebuild it from the
      # checked-out src/ so it self-heals if stale and newly generated artifacts get
      # registered into the manifest/shards that land in the PR (add-paths includes it).
      - name: Build reuse index (capabilities.json)
        run: node scripts/generate-capabilities.mjs

      - name: Write job payload
        shell: bash
        run: |
          cat > blast-job.json <<'BLAST_EOF'
          ${{ inputs.job_payload }}
          BLAST_EOF
          echo "Wrote blast-job.json ($(wc -c < blast-job.json) bytes)"

      - name: Generate + run (reuses local_agent)
        id: generate
        env:
          FRAMEWORK_PATH: ${{ github.workspace }}
          LLM_PLATFORM: ${{ secrets.LLM_PLATFORM }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ secrets.GROK_MODEL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          BASE_URL: ${{ secrets.BASE_URL }}
          # Level 3 flag: '1' turns on the live agentic drive; empty → the existing static path.
          BLAST_LEVEL3: ${{ inputs.level3 && '1' || '' }}
        # Under Level 3 the child playwright-cli spawns need a display — xvfb-run provides one
        # for the whole generate process (harmless for the standard library-browser path too).
        run: ${{ inputs.level3 && 'xvfb-run -a ' || '' }}node .blast-engine/AI_Agents/scripts/blast-ci-generate.js blast-job.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.job_id }}
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload run result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blast-result-${{ inputs.job_id }}
          path: blast-ci-result.json
          if-no-files-found: ignore

      # Remove engine + temp artifacts so ONLY framework src/ changes land in the PR.
      - name: Clean non-framework artifacts
        if: always()
        run: |
          rm -rf .blast-engine blast-job.json blast-ci-result.json || true

      - name: Open Pull Request (the gate)
        if: steps.generate.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT (BLAST_PAT) bypasses the "Allow Actions to create PRs" org/repo toggle.
          # Falls back to the default token, which works once that toggle is enabled.
          token: ${{ secrets.BLAST_PAT || secrets.GITHUB_TOKEN }}
          branch: blast/auto-${{ inputs.job_id }}
          base: main
          title: '[BLAST] ${{ inputs.job_id }} — automated tests (${{ steps.generate.outputs.status }})'
          commit-message: 'test(automation): ${{ inputs.job_id }} generated by B.L.A.S.T. cloud runner'
          body: |
            Automated by the **B.L.A.S.T. cloud runner**.

            - Job: `${{ inputs.job_id }}`
            - Execution status: `${{ steps.generate.outputs.status }}`
            - Changed files: `${{ steps.generate.outputs.changed_count }}`

            Reuse-first + no-clobber guards ran during generation. Review the diff
            before merging — the framework's existing tests are protected.
          add-paths: |
            src/**
            .ai-memory/**
          delete-branch: true
